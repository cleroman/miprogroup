{% extends 'website/base.html' %}
{% block content %}
<section class="section-padding" style="margin-top: 80px; background: var(--light-gray);">
    <div class="container" style="max-width: 800px;">
        <h2 class="section-title text-center">Demande de Projet</h2>
        <div style="background: white; padding: 40px; border-radius: 8px; margin-top: 30px;">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Soumettre le dossier</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
